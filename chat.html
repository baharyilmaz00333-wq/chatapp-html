<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f7f8f6" />
  <title>Sohbetlerin — baharchat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --green:#075e54; --bright:#25d366; --soft:#d9fdd3; --ink:#1d2923; --muted:#738078; --line:#e8ece8; --canvas:#f7f8f6; --white:#fff; --ease:cubic-bezier(.25,.1,.25,1); }
    * { box-sizing:border-box; }
    body { margin:0; height:100vh; min-height:520px; overflow:hidden; color:var(--ink); background:var(--canvas); font-family:'DM Sans',sans-serif; }
    a { color:inherit; text-decoration:none; }
    button,input,textarea { font:inherit; }
    .topbar { height:62px; display:flex; align-items:center; justify-content:space-between; padding:0 25px; background:#fff; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:8px; font-size:19px; font-weight:700; letter-spacing:-.07em; }
    .brand svg { width:27px; color:var(--green); }
    .top-actions { display:flex; align-items:center; gap:15px; color:#78837b; font-size:12px; }
    .top-actions a:hover { color:var(--green); }
    .profile { width:31px; height:31px; display:grid; place-items:center; border-radius:50%; background:#e9f7ed; color:var(--green); font-size:10px; font-weight:700; }
    .workspace { height:calc(100vh - 62px); display:grid; grid-template-columns:58px 330px minmax(0,1fr); background:#fff; }
    .rail { display:flex; flex-direction:column; align-items:center; gap:10px; padding:13px 0; border-right:1px solid var(--line); background:#fbfcfb; }
    .rail-button { position:relative; width:38px; height:38px; display:grid; place-items:center; border:0; border-radius:11px; background:transparent; color:#829087; font-size:17px; cursor:pointer; }
    .rail-button.active { background:#e8f6eb; color:var(--green); }
    .rail-button:hover { background:#f0f4f0; }
    .rail-spacer { flex:1; }
    .chat-sidebar { display:flex; min-height:0; flex-direction:column; border-right:1px solid var(--line); }
    .sidebar-heading { display:flex; align-items:center; justify-content:space-between; padding:20px 17px 13px; }
    .sidebar-heading h1 { margin:0; font-size:20px; letter-spacing:-.04em; }
    .sidebar-tools { display:flex; gap:7px; }
    .icon-button { width:31px; height:31px; display:grid; place-items:center; border:0; border-radius:50%; background:transparent; color:#65736a; font-size:17px; cursor:pointer; }
    .icon-button:hover { background:#f1f4f1; }
    .search-wrap { padding:0 13px 12px; }
    .search { display:flex; align-items:center; gap:8px; height:36px; padding:0 11px; border-radius:9px; background:#f2f5f2; color:#849087; }
    .search input { width:100%; border:0; outline:0; background:transparent; color:var(--ink); font-size:11px; }
    .search input::placeholder { color:#89948c; }
    .filter-row { display:flex; gap:7px; padding:0 13px 12px; border-bottom:1px solid var(--line); }
    .filter { padding:6px 10px; border:0; border-radius:999px; background:#f2f5f2; color:#65736a; font-size:9px; cursor:pointer; }
    .filter.active { background:#e4f5e8; color:var(--green); font-weight:700; }
    .chat-list { min-height:0; overflow:auto; padding:5px 7px 12px; }
    .chat-item { width:100%; display:flex; align-items:center; gap:10px; padding:10px 9px; border:0; border-radius:10px; background:transparent; text-align:left; cursor:pointer; }
    .chat-item:hover { background:#f5f7f5; }
    .chat-item.selected { background:#eaf6ec; }
    .avatar { position:relative; flex:0 0 auto; width:42px; height:42px; display:grid; place-items:center; border-radius:50%; background:#e4eee5; color:#48614e; font-size:10px; font-weight:700; }
    .avatar.green { background:#dff1e2; color:#28613c; }.avatar.gold { background:#f7edda; color:#8e6b29; }.avatar.rose { background:#f5e5e2; color:#92584e; }.avatar.blue { background:#e4edf5; color:#4e6c86; }
    .avatar.group { background:#d8f1dc; color:#146f42; }
    .online { position:absolute; right:0; bottom:0; width:10px; height:10px; border:2px solid #fff; border-radius:50%; background:#25d366; }
    .item-copy { min-width:0; flex:1; }
    .item-top { display:flex; align-items:center; justify-content:space-between; gap:5px; margin-bottom:4px; }
    .item-top strong { overflow:hidden; color:#26352b; font-size:11px; white-space:nowrap; text-overflow:ellipsis; }
    .item-time { flex:0 0 auto; color:#89948c; font-size:8px; }
    .item-bottom { display:flex; align-items:center; justify-content:space-between; gap:6px; }
    .item-bottom span:first-child { overflow:hidden; color:#78847b; font-size:9px; white-space:nowrap; text-overflow:ellipsis; }
    .unread { min-width:16px; height:16px; padding:0 5px; display:grid; place-items:center; border-radius:999px; background:#25d366; color:#164126; font-size:8px; font-weight:700; }
    .empty-search { padding:24px 12px; color:#869189; text-align:center; font-size:11px; }
    .conversation { min-width:0; display:flex; flex-direction:column; background:#efeae2; background-image:radial-gradient(rgba(7,94,84,.045) .7px,transparent .7px); background-size:19px 19px; }
    .conversation-top { height:62px; display:flex; flex:0 0 auto; align-items:center; gap:10px; padding:0 20px; border-bottom:1px solid #e6e9e4; background:rgba(255,255,255,.96); }
    .back-button { display:none; }
    .conversation-title { min-width:0; }
    .conversation-title strong { display:block; color:#26352b; font-size:12px; }
    .conversation-title small { display:block; margin-top:3px; color:#87928a; font-size:9px; }
    .conversation-actions { display:flex; gap:7px; margin-left:auto; }
    .conversation-actions .icon-button { font-size:15px; }
    .messages { min-height:0; flex:1; overflow:auto; display:flex; flex-direction:column; gap:9px; padding:23px max(24px, calc((100% - 620px)/2)) 18px; }
    .date-chip { align-self:center; margin:0 0 7px; padding:6px 10px; border:1px solid rgba(0,0,0,.04); border-radius:7px; background:rgba(255,255,255,.8); color:#748078; font-size:8px; box-shadow:0 1px 1px rgba(0,0,0,.03); }
    .message { width:fit-content; max-width:min(78%, 390px); padding:9px 11px 7px; border-radius:9px; background:#fff; color:#28372d; font-size:10px; line-height:1.55; box-shadow:0 1px 1px rgba(0,0,0,.07); overflow-wrap:anywhere; }
    .message.outgoing { align-self:flex-end; border-top-right-radius:3px; background:#d9fdd3; }
    .message.incoming { border-top-left-radius:3px; }
    .message-meta { display:inline-flex; align-items:center; gap:3px; margin-left:9px; color:#819087; font-size:7px; white-space:nowrap; }
    .checks { color:#43a6a1; font-size:9px; }
    .composer-wrap { flex:0 0 auto; padding:10px 18px 14px; }
    .composer { max-width:780px; display:flex; align-items:center; gap:10px; margin:0 auto; padding:7px 9px; border:1px solid #e7ebe6; border-radius:13px; background:#fff; box-shadow:0 2px 5px rgba(0,0,0,.035); }
    .composer button { flex:0 0 auto; width:29px; height:29px; border:0; border-radius:50%; background:transparent; color:#728077; font-size:16px; cursor:pointer; }
    .composer button:hover { background:#f0f4f0; }
    .composer textarea { min-width:0; max-height:100px; flex:1; resize:none; border:0; outline:0; padding:7px 0; color:#28372d; background:transparent; font-size:10px; }
    .composer textarea::placeholder { color:#8c978f; }
    .send-button { background:#e7f7eb !important; color:#087b45 !important; }
    .send-button:hover { background:#d8f2df !important; }
    @media (prefers-reduced-motion: no-preference) {
      .chat-item, .icon-button, .rail-button, .filter { transition: background-color 140ms var(--ease), color 140ms var(--ease); }
    }
    @media (max-width: 850px) {
      .workspace { grid-template-columns:54px 295px minmax(0,1fr); }
      .messages { padding-right:22px; padding-left:22px; }
    }
    @media (max-width: 650px) {
      body { min-height:0; }
      .topbar { height:56px; padding:0 14px; }
      .top-actions > a { display:none; }
      .workspace { position:relative; height:calc(100vh - 56px); display:block; }
      .rail { display:none; }
      .chat-sidebar { position:absolute; inset:0; display:flex; border-right:0; }
      .conversation { position:absolute; inset:0; display:none; }
      .workspace.show-conversation .chat-sidebar { display:none; }
      .workspace.show-conversation .conversation { display:flex; }
      .conversation-top { height:58px; padding:0 11px; }
      .back-button { display:grid; margin-left:-7px; }
      .messages { padding:18px 12px; }
      .message { max-width:84%; }
      .composer-wrap { padding:8px 9px max(10px, env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="baharchat ana sayfa"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 3.5c-7 0-12.5 4.9-12.5 11 0 2.7 1.1 5.1 3 7l-.7 6 6-2.6c1.3.4 2.7.6 4.2.6 7 0 12.5-4.9 12.5-11S23 3.5 16 3.5Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M11 14h.1M16 14h.1M21 14h.1" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg>baharchat</a>
    <div class="top-actions"><a href="index.html">Ana sayfa</a><span>Merhaba, Deniz</span><span class="profile" aria-label="Deniz'in profili">DY</span></div>
  </header>
  <main class="workspace" id="workspace">
    <aside class="rail" aria-label="Uygulama menüsü"><button class="rail-button active" aria-label="Sohbetler">☏</button><button class="rail-button" aria-label="Durum">◉</button><button class="rail-button" aria-label="Arşiv">▤</button><span class="rail-spacer"></span><button class="rail-button" aria-label="Ayarlar">⚙</button></aside>
    <aside class="chat-sidebar" aria-label="Sohbet listesi">
      <div class="sidebar-heading"><h1>Sohbetler</h1><div class="sidebar-tools"><button class="icon-button" aria-label="Yeni sohbet">✎</button><button class="icon-button" aria-label="Menü">⋮</button></div></div>
      <div class="search-wrap"><label class="search"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="Sohbetlerde ara" aria-label="Sohbetlerde ara" /></label></div>
      <div class="filter-row"><button class="filter active" data-filter="all">Tümü</button><button class="filter" data-filter="unread">Okunmamış</button><button class="filter" data-filter="groups">Gruplar</button></div>
      <div class="chat-list" id="chatList" aria-live="polite"></div>
    </aside>
    <section class="conversation" aria-label="Seçili sohbet">
      <div class="conversation-top"><button class="icon-button back-button" id="backButton" aria-label="Sohbet listesine dön">‹</button><span class="avatar group" id="activeAvatar">YA</span><span class="conversation-title"><strong id="activeName">Yakın arkadaşlar</strong><small id="activeStatus">Ayşe, Bora, Deniz ve sen</small></span><div class="conversation-actions"><button class="icon-button" aria-label="Görüntülü ara">▣</button><button class="icon-button" aria-label="Ara">⌕</button><button class="icon-button" aria-label="Sohbet menüsü">⋮</button></div></div>
      <div class="messages" id="messages" aria-live="polite"></div>
      <form class="composer-wrap" id="messageForm"><div class="composer"><button type="button" aria-label="Emoji ekle">☺</button><button type="button" aria-label="Dosya ekle">＋</button><textarea id="messageInput" rows="1" placeholder="Bir mesaj yaz" aria-label="Bir mesaj yaz"></textarea><button class="send-button" type="submit" aria-label="Mesajı gönder">➤</button></div></form>
    </section>
  </main>
  <script>
    const chats = [
      { id:'friends', name:'Yakın arkadaşlar', initials:'YA', color:'group', group:true, status:'Ayşe, Bora, Deniz ve sen', preview:'Deniz: Tamamdır 🌿', time:'10:43', unread:2, messages:[
        {from:'system', text:'BUGÜN'},
        {from:'Bora', text:'Hafta sonu için plan yapalım mı?', time:'10:41'},
        {from:'you', text:'Ben varım 🙌', time:'10:42'},
        {from:'Ayşe', text:'Şu sahil tarafındaki küçük kafeye ne dersiniz? ☀️', time:'10:42'},
        {from:'you', text:'Çok iyi fikir. Saat 11 gibi?', time:'10:43'}
      ]},
      { id:'ayse', name:'Ayşe E.', initials:'AE', color:'rose', status:'çevrimiçi', preview:'Bir ses gönderdi', time:'10:38', unread:1, messages:[{from:'system',text:'BUGÜN'},{from:'Ayşe',text:'Sana kısa bir ses bıraktım 🎙️',time:'10:36'},{from:'you',text:'Birazdan dinliyorum 💚',time:'10:38'}]},
      { id:'family', name:'Aile grubu', initials:'Aİ', color:'gold', group:true, status:'6 katılımcı', preview:'Bugün kim müsait?', time:'09:52', unread:0, messages:[{from:'system',text:'BUGÜN'},{from:'Anne',text:'Pazar günü yemeğe bekliyorum herkesi 🍲',time:'09:48'},{from:'Baba',text:'Biz müsaitiz 👍',time:'09:52'}]},
      { id:'bora', name:'Bora K.', initials:'BK', color:'blue', status:'çevrimiçi', preview:'Son görülme şimdi', time:'Dün', unread:0, messages:[{from:'system',text:'DÜN'},{from:'Bora',text:'Yeni çalma listemi yolluyorum 🎵',time:'20:14'},{from:'you',text:'Tam hafta sonu havası',time:'20:20'}]},
      { id:'melis', name:'Melis K.', initials:'MK', color:'green', status:'son görülme bugün 09:14', preview:'Fotoğraf gönderdi', time:'Dün', unread:0, messages:[{from:'system',text:'DÜN'},{from:'Melis',text:'Bu manzarayı görünce seni düşündüm 🌅',time:'18:24'},{from:'you',text:'Çok güzelmiş!',time:'18:31'}]}
    ];
    const workspace = document.querySelector('#workspace');
    const chatList = document.querySelector('#chatList');
    const messages = document.querySelector('#messages');
    const activeName = document.querySelector('#activeName');
    const activeStatus = document.querySelector('#activeStatus');
    const activeAvatar = document.querySelector('#activeAvatar');
    let activeId = 'friends';
    let activeFilter = 'all';
    const escapeHtml = value => value.replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function renderList() {
      const query = document.querySelector('#searchInput').value.trim().toLocaleLowerCase('tr');
      const visible = chats.filter(chat => {
        const matchesQuery = `${chat.name} ${chat.preview}`.toLocaleLowerCase('tr').includes(query);
        const matchesFilter = activeFilter === 'all' || (activeFilter === 'unread' ? chat.unread > 0 : chat.group);
        return matchesQuery && matchesFilter;
      });
      chatList.innerHTML = visible.length ? visible.map(chat => `
        <button class="chat-item ${chat.id === activeId ? 'selected' : ''}" data-chat="${chat.id}" aria-current="${chat.id === activeId ? 'true' : 'false'}">
          <span class="avatar ${chat.color}">${chat.initials}${chat.status === 'çevrimiçi' ? '<i class="online"></i>' : ''}</span>
          <span class="item-copy"><span class="item-top"><strong>${escapeHtml(chat.name)}</strong><span class="item-time">${escapeHtml(chat.time)}</span></span><span class="item-bottom"><span>${escapeHtml(chat.preview)}</span>${chat.unread ? `<span class="unread">${chat.unread}</span>` : ''}</span></span>
        </button>`).join('') : '<div class="empty-search">Bu aramayla eşleşen sohbet yok.</div>';
    }
    function renderMessages(chat) {
      activeName.textContent = chat.name;
      activeStatus.textContent = chat.status;
      activeAvatar.textContent = chat.initials;
      activeAvatar.className = `avatar ${chat.color}`;
      messages.innerHTML = chat.messages.map(message => {
        if (message.from === 'system') return `<span class="date-chip">${escapeHtml(message.text)}</span>`;
        const outgoing = message.from === 'you';
        const sender = !outgoing && chat.group ? `<strong>${escapeHtml(message.from)}:</strong> ` : '';
        return `<div class="message ${outgoing ? 'outgoing' : 'incoming'}">${sender}${escapeHtml(message.text)}<span class="message-meta">${escapeHtml(message.time || '')}${outgoing ? '<span class="checks">✓✓</span>' : ''}</span></div>`;
      }).join('');
      messages.scrollTop = messages.scrollHeight;
    }
    chatList.addEventListener('click', event => {
      const button = event.target.closest('[data-chat]');
      if (!button) return;
      activeId = button.dataset.chat;
      const chat = chats.find(item => item.id === activeId);
      chat.unread = 0;
      renderList();
      renderMessages(chat);
      workspace.classList.add('show-conversation');
    });
    document.querySelector('#searchInput').addEventListener('input', renderList);
    document.querySelectorAll('.filter').forEach(button => button.addEventListener('click', () => {
      activeFilter = button.dataset.filter;
      document.querySelectorAll('.filter').forEach(filter => filter.classList.toggle('active', filter === button));
      renderList();
    }));
    document.querySelector('#backButton').addEventListener('click', () => workspace.classList.remove('show-conversation'));
    document.querySelector('#messageForm').addEventListener('submit', event => {
      event.preventDefault();
      const input = document.querySelector('#messageInput');
      const text = input.value.trim();
      if (!text) return;
      const chat = chats.find(item => item.id === activeId);
      const now = new Intl.DateTimeFormat('tr-TR', {hour:'2-digit', minute:'2-digit'}).format(new Date());
      chat.messages.push({from:'you', text, time:now});
      chat.preview = `Sen: ${text}`;
      chat.time = now;
      input.value = '';
      renderMessages(chat);
      renderList();
    });
    renderList();
    renderMessages(chats[0]);
  </script>
</body>
</html>
